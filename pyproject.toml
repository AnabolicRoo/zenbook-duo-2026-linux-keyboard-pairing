[project]
name = "zenbook-duo-2026-linux-keyboard-pairing"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
